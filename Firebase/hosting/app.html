<script>
  // The link every share ends with. With CNSNN installed, the phone opens the app for it (universal
  // link / App Link) and this page never shows. Without it: straight to the store of this phone.
  (() => {
    const ua = navigator.userAgent;
    const iPhone = /iPhone|iPad|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    if (iPhone) location.replace('https://apps.apple.com/app/id6823569042');
    else if (/android/i.test(ua)) location.replace('https://play.google.com/store/apps/details?id=com.poupoutch.cnsnn');
  })();
</script>
