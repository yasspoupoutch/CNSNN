name: CNSNN - Préparer la revue App Store

# Lancement manuel : affiche puis (avec apply) règle la build, la classification d'âge et le
# prix de la version en préparation. Ne soumet jamais rien à la revue d'Apple.
on:
  workflow_dispatch:
    inputs:
      apply:
        description: Appliquer les réglages (sinon lecture seule)
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: cnsnn-appstore-release
  cancel-in-progress: false

jobs:
  release:
    name: Vérifier et régler build, âge et prix
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Lire et régler la version
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          APPLY_INPUT: ${{ inputs.apply }}
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --break-system-packages cryptography 2>/dev/null || python3 -m pip install --quiet cryptography
          key="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$ASC_KEY_P8" > "$key"; chmod 600 "$key"
          trap 'rm -f "$key"' EXIT
          flag=''
          if [ "$APPLY_INPUT" = 'true' ]; then flag='--apply'; fi
          python3 Scripts/asc_release.py "$ASC_KEY_ID" "$ASC_ISSUER_ID" "$key" com.poupoutch.cnsnn $flag \
            | tee -a "$GITHUB_STEP_SUMMARY"
