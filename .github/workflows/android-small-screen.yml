name: CNSNN - Android petit écran

# L'app sur un petit téléphone (comme un Galaxy S9 : 360 × 740 dp, clavier à l'écran) : la page du pseudo
# garde sa case à cocher et son bouton au-dessus du clavier, Double sens montre ses deux indices au-dessus
# de la réponse, sans faire défiler. Les captures sont publiées sur la branche apercus-android.
on:
  push:
    branches: ['claude/**']
    paths: ['.github/workflows/android-small-screen.yml', 'Android/tools/small-screen.sh', 'Android/app/src/androidTest/java/com/poupoutch/cnsnn/SmallScreenTest.kt',
      'Android/app/src/main/java/com/poupoutch/cnsnn/ui/RootScreen.kt', 'Android/app/src/main/java/com/poupoutch/cnsnn/ui/ModeScreen.kt', 'Android/app/src/main/java/com/poupoutch/cnsnn/ui/GameScreen.kt']
  pull_request:
    paths: ['Android/app/src/main/java/com/poupoutch/cnsnn/ui/RootScreen.kt', 'Android/app/src/main/java/com/poupoutch/cnsnn/ui/ModeScreen.kt', 'Android/app/src/main/java/com/poupoutch/cnsnn/ui/GameScreen.kt']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cnsnn-android-small-screen-${{ github.ref }}
  cancel-in-progress: true

jobs:
  petit-ecran:
    name: Petit écran sans défilement (émulateur)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Libérer de la place sur le disque
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost \
            /usr/share/swift /usr/local/julia* /opt/hostedtoolcache/CodeQL /usr/local/share/powershell /usr/local/share/chromium
          sudo docker image prune --all --force > /dev/null 2>&1 || true
      - name: Activer KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Démarrer les émulateurs Firebase
        working-directory: Firebase
        run: |
          npm ci --no-audit --no-fund || npm install --no-audit --no-fund
          nohup npx firebase emulators:start --only auth,firestore --project demo-cnsnn > "$RUNNER_TEMP/emulators.log" 2>&1 &
          for i in $(seq 1 90); do
            if curl -s -o /dev/null http://127.0.0.1:8080 && curl -s -o /dev/null http://127.0.0.1:9099; then echo "Émulateurs prêts"; exit 0; fi
            sleep 2
          done
          cat "$RUNNER_TEMP/emulators.log"; exit 1
      - name: Compiler l'app de test
        working-directory: Android
        env:
          CNSNN_EMULATOR_HOST: 10.0.2.2
        run: ./gradlew --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Petit écran, clavier ouvert
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        env:
          CNSNN_EMULATOR_HOST: 10.0.2.2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          working-directory: Android
          script: ./tools/small-screen.sh ${{ runner.temp }}/shots
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: cnsnn-petit-ecran
          path: ${{ runner.temp }}/shots/*
          retention-days: 7

  publier:
    name: Publier les captures sur la branche apercus-android
    needs: petit-ecran
    # Aussi après un échec : zz-echec.png montre ce qui dépasse.
    if: always() && github.event_name != 'pull_request' && needs.petit-ecran.result != 'skipped' && needs.petit-ecran.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: cnsnn-petit-ecran
          path: ${{ runner.temp }}/shots
      - name: Pousser les captures
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout --orphan apercus-android
          git rm -rf --quiet .
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          mkdir -p petit-ecran
          cp "$RUNNER_TEMP/shots/"* petit-ecran/
          git add -A .
          git commit -m "Captures petit écran depuis ${GITHUB_SHA::7}"
          git push --force origin HEAD:refs/heads/apercus-android
