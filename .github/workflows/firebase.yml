name: CNSNN - Firebase

# Rules tests run on every change to Firebase/. Deploying rules and indexes to the
# production project, or granting the moderator role, only happens on a manual run from main.
# Every month, the secret daily words are published for the next 364 days, so they never run out.
on:
  schedule:
    - cron: '17 3 1 * *'
    # Every morning: Firestore use against the free quota (fails, so GitHub emails, past 60 %).
    - cron: '41 7 * * *'
  pull_request:
    paths: ['Firebase/**', 'Shared/**', '.github/workflows/firebase.yml']
  push:
    branches: [main]
    paths: ['Firebase/**', 'Shared/**', '.github/workflows/firebase.yml']
  workflow_dispatch:
    inputs:
      usage:
        description: Estimer l'usage Firestore des 7 derniers jours face au quota gratuit
        type: boolean
        default: false
      players:
        description: Liste des joueurs avec un pseudo, même sans partie (chiffrée)
        type: boolean
        default: false
      deploy:
        description: Publier les règles et index Firestore sur cnsnn-9ctosy
        type: boolean
        default: false
      admin_uid:
        description: UID Firebase à nommer administrateur (facultatif)
        type: string
        default: ''
      delete_users:
        description: Pseudos de comptes à supprimer, séparés par des virgules (montrés seulement, sauf confirmation)
        type: string
        default: ''
      confirm_delete:
        description: Confirmer la suppression définitive des comptes ci-dessus
        type: boolean
        default: false
      daily_public_key:
        description: Afficher la clé publique qui chiffre la liste des mots du jour
        type: boolean
        default: false
      daily_seed:
        description: Publier les mots du jour secrets (Firebase/daily/words.enc.json)
        type: boolean
        default: false
      daily_change:
        description: "Mots du jour trop durs : voir (aujourd'hui et 14 jours, chiffré) ou appliquer (Firebase/daily/changes.enc.json)"
        type: choice
        options: ['', voir, appliquer]
        default: ''
      android_app:
        description: Enregistrer l'application Android et afficher son google-services.json
        type: boolean
        default: false
      site:
        description: Publier le site public (confidentialité, règles, suppression de compte, APK Android)
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: cnsnn-firebase-${{ github.ref }}
  cancel-in-progress: false

jobs:
  rules-tests:
    name: Tester les règles Firestore (émulateur)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: Firebase
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci || npm install --no-audit --no-fund
      - run: npm test

  secret-words:
    name: Vérifier que les cartes ne dévoilent aucun mot du jour
    # The secret key is only given to runs of this repository (never to a fork's pull request).
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Comparer les cartes et les duos aux mots du jour chiffrés
        run: |
          set -euo pipefail
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then echo '::error::Le secret FIREBASE_SERVICE_ACCOUNT est absent.'; exit 1; fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          python3 Scripts/generate_content.py --check
          python3 Scripts/generate_content.py --words > "$RUNNER_TEMP/words.txt"
          report=''
          if [ -f Firebase/daily/report.pem ]; then report=Firebase/daily/report.pem; fi
          GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json" node Firebase/tools/daily.mjs overlap "$RUNNER_TEMP/words.txt" $report
      - name: Effacer la clé
        if: ${{ always() }}
        run: rm -f "$RUNNER_TEMP/sa.json"

  deploy:
    name: Publier sur Firebase
    needs: rules-tests
    # Writes only from main. Printing the public key, the usage counts or encrypted lists is harmless, so they also run on a branch.
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && ((github.ref == 'refs/heads/main' && (inputs.deploy || inputs.admin_uid != '' || inputs.delete_users != '' || inputs.daily_seed || inputs.daily_change == 'appliquer' || inputs.android_app || inputs.site)) || inputs.daily_public_key || inputs.daily_change == 'voir' || inputs.usage || inputs.players)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: Firebase
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Vérifier la clé du compte de service
        run: |
          set -euo pipefail
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo '::error::Le secret FIREBASE_SERVICE_ACCOUNT est absent (voir Docs/FIREBASE.md).'
            exit 1
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"
          node -e "const k=require(process.argv[1]);if(k.project_id!=='cnsnn-9ctosy'){console.error('Clé pour un autre projet : '+k.project_id);process.exit(1)}" "$RUNNER_TEMP/sa.json"
      - run: npm ci || npm install --no-audit --no-fund
      - name: Publier les règles et index
        if: ${{ inputs.deploy && github.ref == 'refs/heads/main' }}
        run: node tools/deploy.mjs
      - name: Nommer un administrateur
        if: ${{ inputs.admin_uid != '' && github.ref == 'refs/heads/main' }}
        env:
          ADMIN_UID: ${{ inputs.admin_uid }}
        run: node tools/grant-admin.mjs "$ADMIN_UID"
      - name: Montrer ou supprimer des comptes
        if: ${{ inputs.delete_users != '' && github.ref == 'refs/heads/main' }}
        env:
          DELETE_USERS: ${{ inputs.delete_users }}
          CONFIRM: ${{ inputs.confirm_delete && '--delete' || '' }}
        run: node tools/delete-users.mjs "$DELETE_USERS" $CONFIRM
      - name: Clé publique des mots du jour
        if: ${{ inputs.daily_public_key }}
        run: node tools/daily.mjs public-key
      - name: Publier les mots du jour
        if: ${{ github.event.schedule == '17 3 1 * *' || (inputs.daily_seed && github.ref == 'refs/heads/main') }}
        run: node tools/daily.mjs seed
      - name: Voir les mots du jour à venir (chiffrés)
        if: ${{ inputs.daily_change == 'voir' }}
        run: node tools/daily.mjs preview daily/preview.pem
      - name: Remplacer des mots du jour
        if: ${{ inputs.daily_change == 'appliquer' && github.ref == 'refs/heads/main' }}
        run: node tools/daily.mjs replace
      - name: Usage Firestore face au quota gratuit
        if: ${{ github.event.schedule == '41 7 * * *' || inputs.usage }}
        run: node tools/usage.mjs
      - name: Liste des joueurs (chiffrée)
        if: ${{ inputs.players }}
        run: node tools/players.mjs tools/players.pem
      - name: Enregistrer l'application Android
        if: ${{ inputs.android_app && github.ref == 'refs/heads/main' }}
        run: node tools/android-app.mjs
      - name: Publier le site
        if: ${{ inputs.site && github.ref == 'refs/heads/main' }}
        # No APK: the free Spark plan refuses executable files on Hosting.
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: node tools/hosting.mjs
      - name: Effacer la clé
        if: ${{ always() }}
        run: rm -f "$RUNNER_TEMP/sa.json"
