name: CNSNN - Firebase

# Rules tests run on every change to Firebase/. Deploying rules and indexes to the
# production project, or granting the moderator role, only happens on a manual run from main.
# Every month, the secret daily words are published for the next 364 days, so they never run out.
on:
  schedule:
    - cron: '17 3 1 * *'
  pull_request:
    paths: ['Firebase/**', '.github/workflows/firebase.yml']
  push:
    branches: [main]
    paths: ['Firebase/**', '.github/workflows/firebase.yml']
  workflow_dispatch:
    inputs:
      deploy:
        description: Publier les règles et index Firestore sur cnsnn-9ctosy
        type: boolean
        default: false
      admin_uid:
        description: UID Firebase à nommer administrateur (facultatif)
        type: string
        default: ''
      daily_public_key:
        description: Afficher la clé publique qui chiffre la liste des mots du jour
        type: boolean
        default: false
      daily_seed:
        description: Publier les mots du jour secrets (Firebase/daily/words.enc.json)
        type: boolean
        default: false
      android_app:
        description: Enregistrer l'application Android et afficher son google-services.json
        type: boolean
        default: false
      site:
        description: Publier le site public (confidentialité, règles, suppression de compte, APK Android)
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: cnsnn-firebase-${{ github.ref }}
  cancel-in-progress: false

jobs:
  rules-tests:
    name: Tester les règles Firestore (émulateur)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: Firebase
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci || npm install --no-audit --no-fund
      - run: npm test

  deploy:
    name: Publier sur Firebase
    needs: rules-tests
    # Writes only from main. Printing the public key is harmless, so it also runs on a branch.
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && ((github.ref == 'refs/heads/main' && (inputs.deploy || inputs.admin_uid != '' || inputs.daily_seed || inputs.android_app || inputs.site)) || inputs.daily_public_key)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: Firebase
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Vérifier la clé du compte de service
        run: |
          set -euo pipefail
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo '::error::Le secret FIREBASE_SERVICE_ACCOUNT est absent (voir Docs/FIREBASE.md).'
            exit 1
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"
          node -e "const k=require(process.argv[1]);if(k.project_id!=='cnsnn-9ctosy'){console.error('Clé pour un autre projet : '+k.project_id);process.exit(1)}" "$RUNNER_TEMP/sa.json"
      - run: npm ci || npm install --no-audit --no-fund
      - name: Publier les règles et index
        if: ${{ inputs.deploy && github.ref == 'refs/heads/main' }}
        run: node tools/deploy.mjs
      - name: Nommer un administrateur
        if: ${{ inputs.admin_uid != '' && github.ref == 'refs/heads/main' }}
        env:
          ADMIN_UID: ${{ inputs.admin_uid }}
        run: node tools/grant-admin.mjs "$ADMIN_UID"
      - name: Clé publique des mots du jour
        if: ${{ inputs.daily_public_key }}
        run: node tools/daily.mjs public-key
      - name: Publier les mots du jour
        if: ${{ github.event_name == 'schedule' || (inputs.daily_seed && github.ref == 'refs/heads/main') }}
        run: node tools/daily.mjs seed
      - name: Enregistrer l'application Android
        if: ${{ inputs.android_app && github.ref == 'refs/heads/main' }}
        run: node tools/android-app.mjs
      - name: Récupérer le dernier APK Android
        if: ${{ inputs.site && github.ref == 'refs/heads/main' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          run=$(gh run list -R "$GITHUB_REPOSITORY" --workflow android.yml --branch main --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          if [ -n "$run" ] && gh run download "$run" -R "$GITHUB_REPOSITORY" -n CNSNN-Android-APK -D "$RUNNER_TEMP/apk"; then
            echo "APK=$(find "$RUNNER_TEMP/apk" -name '*.apk' | head -1)" >> "$GITHUB_ENV"
          else
            echo '::warning::Aucun APK récent (les artefacts expirent après 7 jours) : le site est publié sans le téléchargement Android.'
          fi
      - name: Publier le site
        if: ${{ inputs.site && github.ref == 'refs/heads/main' }}
        run: node tools/hosting.mjs ${APK:-}
      - name: Effacer la clé
        if: ${{ always() }}
        run: rm -f "$RUNNER_TEMP/sa.json"
