name: CNSNN - Captures App Store

# Lancement manuel uniquement : captures d'écran et aperçu vidéo App Store sur un simulateur iPhone
# 6,9 pouces (1320 x 2868), et les mêmes captures sur l'iPhone Duo pour vérifier la mise en page. L'app tourne avec `--uitesting --screenshots` : profil, classement et défis
# inventés, hors ligne (App/Services/ScreenshotDemo.swift), et seulement des cartes publiques du
# Classique, jamais un mot du jour secret. Les PNG sont publiés en artefact et sur la branche
# `store-screenshots` (dossier ios/<apparence>/).
on:
  workflow_dispatch:
    inputs:
      appearance:
        description: Apparence du simulateur
        required: false
        type: choice
        options:
          - dark
          - light
        default: dark

permissions:
  contents: read

# Un nouveau lancement sur la même branche remplace le précédent.
concurrency:
  group: cnsnn-ios-screenshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    name: Prendre les captures App Store
    runs-on: xcode-27
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.app/Contents/Developer
      CI: 'true'
      NSUnbufferedIO: 'YES'
      APPEARANCE: ${{ inputs.appearance || 'dark' }}

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Vérifier Xcode 27 et la structure du projet
        run: |
          set -euo pipefail
          printf 'CI_ROOT=%s/cnsnn-ci\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/cnsnn-ci/logs"
          xcodebuild -version | tee "$RUNNER_TEMP/cnsnn-ci/logs/xcode-version.log"
          if ! grep -Eq '^Xcode 27([.]|$)' "$RUNNER_TEMP/cnsnn-ci/logs/xcode-version.log"; then
            echo '::error::Le runner doit fournir Xcode 27.'
            exit 1
          fi
          python3 Scripts/verify_project.py

      - name: Télécharger les dépendances Firebase avec Swift Package Manager
        timeout-minutes: 10
        run: |
          set -euo pipefail
          xcodebuild -resolvePackageDependencies \
            -project CNSNN.xcodeproj \
            -scheme CNSNN \
            -clonedSourcePackagesDirPath "$CI_ROOT/SourcePackages" \
            -derivedDataPath "$CI_ROOT/DerivedData" \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            DEVELOPMENT_TEAM='' \
            2>&1 | tee "$CI_ROOT/logs/packages.log"

      # iPhone 17 Pro Max (écran 6,9 pouces, 1320 x 2868) de préférence, sinon le plus récent des
      # « Pro Max », sur un iOS compatible avec le SDK.
      - name: Choisir un simulateur iPhone 6,9 pouces
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json
          import os
          import re
          import subprocess

          sdk = subprocess.check_output(
              ['xcodebuild', '-version', '-sdk', 'iphonesimulator', 'SDKVersion'],
              text=True,
          ).strip()
          sdk_version = tuple(int(part) for part in sdk.split('.')[:2])
          listing = json.loads(subprocess.check_output(
              ['xcrun', 'simctl', 'list', '--json'], text=True,
          ))
          candidates = []
          for runtime in listing['runtimes']:
              if not runtime.get('isAvailable') or '.iOS-' not in runtime['identifier']:
                  continue
              version = tuple(int(part) for part in runtime['version'].split('.')[:2])
              if version[0] != sdk_version[0] or version > sdk_version:
                  continue
              for device in listing['devices'].get(runtime['identifier'], []):
                  name = device['name']
                  if not device.get('isAvailable') or not name.startswith('iPhone') or 'Pro Max' not in name:
                      continue
                  generation = int(re.search(r'iPhone (\d+)', name).group(1)) if re.search(r'iPhone (\d+)', name) else 0
                  preferred = 1 if name == 'iPhone 17 Pro Max' else 0
                  candidates.append((preferred, generation, version, name, device['udid']))
          if not candidates:
              raise SystemExit(f'Aucun simulateur iPhone Pro Max disponible pour le SDK {sdk}.')
          _, _, version, name, identifier = sorted(candidates, reverse=True)[0]
          if name != 'iPhone 17 Pro Max':
              print(f'::warning::iPhone 17 Pro Max absent : {name} à la place, vérifiez la taille des captures.')
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as file:
              file.write(f'SIMULATOR_ID={identifier}\n')
              file.write(f'SIMULATOR_NAME={name}\n')
          print(f'Simulateur choisi : {name}, iOS {version[0]}.{version[1]}, {identifier}')
          PY

      - name: Compiler l'application et les tests UI sans signature Apple
        run: |
          set -euo pipefail
          xcodebuild build-for-testing \
            -project CNSNN.xcodeproj \
            -scheme CNSNN \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -destination-timeout 60 \
            -clonedSourcePackagesDirPath "$CI_ROOT/SourcePackages" \
            -derivedDataPath "$CI_ROOT/DerivedData" \
            -disableAutomaticPackageResolution \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            DEVELOPMENT_TEAM='' \
            2>&1 | tee "$CI_ROOT/logs/build.log"

      # Simulateur remis à neuf, barre d'état d'une capture Apple (9:41, batterie pleine, réseau au
      # maximum) et apparence choisie.
      - name: Préparer le simulateur (barre d'état, apparence)
        run: |
          set -euo pipefail
          xcrun simctl shutdown "$SIMULATOR_ID" 2>/dev/null || true
          xcrun simctl erase "$SIMULATOR_ID"
          xcrun simctl boot "$SIMULATOR_ID"
          xcrun simctl bootstatus "$SIMULATOR_ID" -b
          xcrun simctl ui "$SIMULATOR_ID" appearance "$APPEARANCE"
          xcrun simctl status_bar "$SIMULATOR_ID" override \
            --time '9:41' \
            --dataNetwork wifi \
            --wifiMode active \
            --wifiBars 3 \
            --cellularMode active \
            --cellularBars 4 \
            --operatorName '' \
            --batteryState charged \
            --batteryLevel 100
          echo "Simulateur prêt : $SIMULATOR_NAME, apparence $APPEARANCE"

      - name: Prendre les captures (CNSNNScreenshotTests)
        run: |
          set -euo pipefail
          xcodebuild test-without-building \
            -project CNSNN.xcodeproj \
            -scheme CNSNN \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -destination-timeout 60 \
            -clonedSourcePackagesDirPath "$CI_ROOT/SourcePackages" \
            -derivedDataPath "$CI_ROOT/DerivedData" \
            -disableAutomaticPackageResolution \
            -parallel-testing-enabled NO \
            -test-timeouts-enabled YES \
            -only-testing:CNSNNUITests/CNSNNScreenshotTests/testAppStoreScreenshots \
            -resultBundlePath "$CI_ROOT/screenshots.xcresult" \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            DEVELOPMENT_TEAM='' \
            2>&1 | tee "$CI_ROOT/logs/screenshots.log"

      # xcresulttool (Xcode 16 et plus) exporte les pièces jointes et un manifest.json qui relie chaque
      # fichier au nom donné dans le test (« 01-accueil_0_<UUID>.png ») : on renomme en 01-accueil.png.
      - name: Extraire les captures du résultat
        run: |
          set -euo pipefail
          rm -rf "$CI_ROOT/attachments" "$CI_ROOT/screenshots"
          mkdir -p "$CI_ROOT/attachments" "$CI_ROOT/screenshots"
          xcrun xcresulttool export attachments \
            --path "$CI_ROOT/screenshots.xcresult" \
            --output-path "$CI_ROOT/attachments"
          python3 - "$CI_ROOT/attachments" "$CI_ROOT/screenshots" <<'PY'
          import json
          import pathlib
          import re
          import shutil
          import sys

          source, target = pathlib.Path(sys.argv[1]), pathlib.Path(sys.argv[2])
          manifest = json.loads((source / 'manifest.json').read_text())
          if isinstance(manifest, dict):
              manifest = [manifest]
          copied = []
          for test in manifest:
              for attachment in test.get('attachments', []):
                  human = attachment.get('suggestedHumanReadableName', '')
                  match = re.match(r'(\d{2}-[a-z0-9]+(?:-[a-z0-9]+)*)', human)
                  if not match:
                      continue
                  name = match.group(1) + '.png'
                  shutil.copyfile(source / attachment['exportedFileName'], target / name)
                  copied.append(name)
          if not copied:
              raise SystemExit('Aucune capture trouvée dans le résultat des tests.')
          for name in sorted(copied):
              print('Capture :', name)
          PY

      # Aperçu vidéo App Store : le simulateur est filmé pendant testAppPreview ; le test écrit
      # « PREVIEW_START <heure> » quand l'app est prête, et la vidéo est coupée à partir de là
      # (le job publish la met au format Apple, 886 x 1920, 30 i/s).
      - name: Filmer l'aperçu vidéo (CNSNNScreenshotTests/testAppPreview)
        run: |
          set -euo pipefail
          mkdir -p "$CI_ROOT/preview"
          xcrun simctl io "$SIMULATOR_ID" recordVideo --codec=h264 --force "$CI_ROOT/preview/raw.mov" &
          recorder=$!
          started=$(python3 -c 'import time; print(time.time())')
          sleep 2
          set +e
          xcodebuild test-without-building \
            -project CNSNN.xcodeproj \
            -scheme CNSNN \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -destination-timeout 60 \
            -clonedSourcePackagesDirPath "$CI_ROOT/SourcePackages" \
            -derivedDataPath "$CI_ROOT/DerivedData" \
            -disableAutomaticPackageResolution \
            -parallel-testing-enabled NO \
            -only-testing:CNSNNUITests/CNSNNScreenshotTests/testAppPreview \
            -resultBundlePath "$CI_ROOT/preview.xcresult" \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            DEVELOPMENT_TEAM='' \
            > "$CI_ROOT/logs/preview.log" 2>&1
          status=$?
          set -e
          kill -INT "$recorder"; wait "$recorder" || true
          tail -20 "$CI_ROOT/logs/preview.log"
          if [ "$status" -ne 0 ]; then echo '::error::Le test de l’aperçu vidéo a échoué.'; exit "$status"; fi
          python3 - "$CI_ROOT/logs/preview.log" "$started" "$CI_ROOT/preview/timing.json" <<'PY'
          import json, re, sys
          log = open(sys.argv[1], encoding='utf-8', errors='replace').read()
          start = float(re.search(r'PREVIEW_START ([0-9.]+)', log).group(1))
          end = float(re.search(r'PREVIEW_END ([0-9.]+)', log).group(1))
          timing = {'offset': round(start - float(sys.argv[2]), 2), 'duration': round(end - start, 2)}
          json.dump(timing, open(sys.argv[3], 'w'))
          print('Aperçu vidéo :', timing)
          PY
          ls -l "$CI_ROOT/preview"

      - name: Conserver la vidéo brute en artefact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cnsnn-preview-ios-${{ env.APPEARANCE }}
          path: ${{ runner.temp }}/cnsnn-ci/preview/
          if-no-files-found: error
          retention-days: 7

      # iPhone Duo (pliable, grand écran intérieur) : mêmes captures sur son simulateur s'il existe sur
      # ce runner, pour vérifier la mise en page. Elles restent en artefact, rien n'est publié.
      - name: Vérifier la mise en page sur l'iPhone Duo
        continue-on-error: true
        run: |
          set -euo pipefail
          duo=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = [d for runtime in json.load(sys.stdin)["devices"].values() for d in runtime if "Duo" in d["name"]]
          print(devices[-1]["udid"] if devices else "")')
          if [ -z "$duo" ]; then
            echo '::warning::Pas de simulateur iPhone Duo sur ce runner : mise en page non vérifiée.'
            xcrun simctl list devicetypes | grep -i iphone | tail -15
            exit 0
          fi
          xcrun simctl boot "$duo"; xcrun simctl bootstatus "$duo" -b
          xcrun simctl ui "$duo" appearance "$APPEARANCE"
          xcodebuild test-without-building \
            -project CNSNN.xcodeproj -scheme CNSNN -configuration Debug -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=$duo" -destination-timeout 60 \
            -clonedSourcePackagesDirPath "$CI_ROOT/SourcePackages" -derivedDataPath "$CI_ROOT/DerivedData" \
            -disableAutomaticPackageResolution -parallel-testing-enabled NO \
            -only-testing:CNSNNUITests/CNSNNScreenshotTests/testAppStoreScreenshots \
            -resultBundlePath "$CI_ROOT/duo.xcresult" \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' DEVELOPMENT_TEAM='' \
            2>&1 | tail -30
          mkdir -p "$CI_ROOT/duo"
          xcrun xcresulttool export attachments --path "$CI_ROOT/duo.xcresult" --output-path "$CI_ROOT/duo"
          xcrun simctl shutdown "$duo" || true

      - name: Conserver les captures iPhone Duo
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cnsnn-screenshots-duo-${{ env.APPEARANCE }}
          path: ${{ runner.temp }}/cnsnn-ci/duo/
          if-no-files-found: ignore
          retention-days: 7

      - name: Conserver les captures en artefact
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cnsnn-screenshots-ios-${{ env.APPEARANCE }}
          path: ${{ runner.temp }}/cnsnn-ci/screenshots/
          if-no-files-found: warn
          retention-days: 30

      # L'App Store attend exactement 1320 x 2868 pour l'iPhone 6,9 pouces.
      - name: Vérifier la taille des captures (1320 x 2868)
        run: |
          set -euo pipefail
          count=0; wrong=0
          for file in "$CI_ROOT/screenshots/"*.png; do
            width=$(sips -g pixelWidth "$file" | awk '/pixelWidth/ {print $2}')
            height=$(sips -g pixelHeight "$file" | awk '/pixelHeight/ {print $2}')
            echo "$(basename "$file") : ${width} x ${height}"
            count=$((count + 1))
            if [ "$width" != 1320 ] || [ "$height" != 2868 ]; then wrong=$((wrong + 1)); fi
          done
          if [ "$count" -lt 6 ]; then
            echo "::error::$count captures seulement, 6 attendues."
            exit 1
          fi
          if [ "$wrong" -gt 0 ]; then
            echo "::error::$wrong capture(s) ne font pas 1320 x 2868 ($SIMULATOR_NAME)."
            exit 1
          fi

      - name: Conserver les journaux en cas d'échec
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cnsnn-screenshots-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/cnsnn-ci/logs/
            ${{ runner.temp }}/cnsnn-ci/*.xcresult
          if-no-files-found: warn
          retention-days: 1

  # Seul ce job peut écrire dans le dépôt, et il ne compile ni n'exécute rien du projet : il pousse
  # les PNG sur la branche `store-screenshots`, dans ios/<apparence>/ (l'autre apparence est gardée).
  publish:
    name: Publier sur la branche store-screenshots
    needs: capture
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    env:
      APPEARANCE: ${{ inputs.appearance || 'dark' }}

    steps:
      - name: Récupérer le dépôt (avec droit d'écriture)
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: true

      - name: Récupérer les captures
        uses: actions/download-artifact@v4
        with:
          name: cnsnn-screenshots-ios-${{ env.APPEARANCE }}
          path: ${{ runner.temp }}/screenshots

      - name: Récupérer la vidéo brute
        uses: actions/download-artifact@v4
        with:
          name: cnsnn-preview-ios-${{ env.APPEARANCE }}
          path: ${{ runner.temp }}/preview

      # Format Apple pour l'iPhone 6,9 pouces : 886 x 1920, 30 i/s, H.264, 15 à 30 s, piste son
      # stéréo (silencieuse ici).
      - name: Mettre l'aperçu vidéo au format App Store
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          offset=$(python3 -c "import json; print(json.load(open('$RUNNER_TEMP/preview/timing.json'))['offset'])")
          ffmpeg -hide_banner -loglevel error -y -ss "$offset" -i "$RUNNER_TEMP/preview/raw.mov" \
            -f lavfi -i anullsrc=channel_layout=stereo:sample_rate=44100 -t 29.5 \
            -vf "scale=886:1920:force_original_aspect_ratio=decrease,pad=886:1920:(ow-iw)/2:(oh-ih)/2:color=0x06070c,fps=30,format=yuv420p" \
            -c:v libx264 -profile:v high -level 4.0 -b:v 8M -maxrate 10M -bufsize 16M \
            -c:a aac -b:a 256k -ar 44100 -ac 2 -shortest -movflags +faststart "$RUNNER_TEMP/preview/preview.mp4"
          length=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$RUNNER_TEMP/preview/preview.mp4")
          size=$(ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=s=x:p=0 "$RUNNER_TEMP/preview/preview.mp4")
          echo "Aperçu vidéo : ${size}, ${length} s"
          python3 -c "import sys; d=float('$length'); sys.exit(0 if 15 <= d <= 30 else 'Durée hors des 15 à 30 s demandées par Apple')"

      - name: Pousser les captures sur store-screenshots
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git fetch --depth=1 origin store-screenshots; then
            git checkout -B store-screenshots FETCH_HEAD
          else
            git checkout --orphan store-screenshots
            git rm -rf --quiet .
          fi
          # La branche ne contient que les captures.
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name ios -exec rm -rf {} +
          rm -rf "ios/$APPEARANCE"
          mkdir -p "ios/$APPEARANCE"
          cp "$RUNNER_TEMP/screenshots/"*.png "ios/$APPEARANCE/"
          cp "$RUNNER_TEMP/preview/preview.mp4" "ios/$APPEARANCE/preview.mp4"
          ls -l "ios/$APPEARANCE"
          git add -A .
          if git diff --cached --quiet; then
            echo 'Captures identiques : rien à publier.'
            exit 0
          fi
          git commit -m "Captures App Store iOS ($APPEARANCE) depuis ${GITHUB_SHA::7}"
          git push --force origin HEAD:refs/heads/store-screenshots
          echo "Captures publiées : https://github.com/$GITHUB_REPOSITORY/tree/store-screenshots/ios/$APPEARANCE"
