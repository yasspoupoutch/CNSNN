name: CNSNN - Alerte nouveaux pseudos

# Once a day, in the evening: a push notification (ntfy app) listing the players who chose a pseudo
# since the last one, or saying there was none. GitHub often skips scheduled runs (on 16-17 Nov only
# 2 of 8 two-hourly runs happened), so it tries 5 times (20 h 17 to 23 h 17 in winter, French time);
# the first try that runs sends, the others see it is done and stop (1 Firestore read). At most
# ~150 billed minutes a month of the 2,000 free, a few Firestore reads a day. Pseudos never appear in the logs, only in the notification.
# A pull request touching it runs a dry check (reads only, sends nothing). Manual run: "test"
# sends a notification even with no new pseudo, to check the phone receives it.
on:
  schedule:
    - cron: '17 19 * * *'
    - cron: '47 19 * * *'
    - cron: '17 20 * * *'
    - cron: '17 21 * * *'
    - cron: '17 22 * * *'
  pull_request:
    paths: ['Firebase/tools/new-pseudos.mjs', '.github/workflows/new-pseudos.yml']
  workflow_dispatch:
    inputs:
      test:
        description: Envoyer une notification d'essai même sans nouveau pseudo
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: cnsnn-new-pseudos
  cancel-in-progress: false

jobs:
  alert:
    name: Nouveaux pseudos
    # The secrets are only given to runs of this repository (never to a fork's pull request).
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          sparse-checkout: Firebase/tools/new-pseudos.mjs
          sparse-checkout-cone-mode: false
      - name: Chercher les nouveaux pseudos et prévenir
        run: |
          set -euo pipefail
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then echo '::error::Le secret FIREBASE_SERVICE_ACCOUNT est absent.'; exit 1; fi
          if [ -z "$NTFY_TOPIC" ]; then echo '::warning::Le secret NTFY_TOPIC est absent : rien ne sera envoyé.'; fi
          mode=''
          if [ "${{ github.event_name }}" = pull_request ]; then mode=--dry-run; fi
          if [ "${{ github.event_name }}" = schedule ]; then mode=--daily; fi
          if [ "${{ inputs.test }}" = true ]; then mode=--test; fi
          node Firebase/tools/new-pseudos.mjs $mode
