name: CNSNN - iPhone TestFlight

# Signs the app with the Apple Developer account and sends it to App Store Connect (TestFlight),
# without a Mac: Scripts/asc_signing.py creates the distribution certificate and the App Store
# profiles through an App Store Connect API key (role Admin), then Xcode signs and uploads.
# Needs these repository secrets, see Docs/PUBLICATION.md:
#   APPLE_TEAM_ID, ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8 (content of the .p8 file).

on:
  workflow_dispatch:
    inputs:
      diagnostic_only:
        description: Seulement vérifier ce que la clé API peut faire (sans compiler)
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: cnsnn-testflight
  cancel-in-progress: false

jobs:
  testflight:
    name: Signer et envoyer sur TestFlight
    runs-on: xcode-27
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.app/Contents/Developer
      CI: 'true'
    steps:
      - name: Recuperer le depot
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Verifier les secrets et l'identifiant de l'app
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          set -euo pipefail
          for name in APPLE_TEAM_ID ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8; do
            if [ -z "${!name}" ]; then echo "::error::Secret $name manquant (voir Docs/PUBLICATION.md)."; exit 1; fi
          done
          xcodebuild -version
          python3 Scripts/verify_project.py
          root="$RUNNER_TEMP/cnsnn-tf"
          mkdir -p "$root/logs" "$root/key"
          printf '%s' "$ASC_KEY_P8" > "$root/key/AuthKey_$ASC_KEY_ID.p8"
          chmod 600 "$root/key/AuthKey_$ASC_KEY_ID.p8"
          printf 'TF_ROOT=%s\n' "$root" >> "$GITHUB_ENV"

      - name: Diagnostiquer l'acces a App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --break-system-packages cryptography 2>/dev/null || python3 -m pip install --quiet cryptography
          python3 Scripts/asc_check.py "$ASC_KEY_ID" "$ASC_ISSUER_ID" "$TF_ROOT/key/AuthKey_$ASC_KEY_ID.p8" com.poupoutch.cnsnn \
            | tee "$TF_ROOT/logs/asc-check.log" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Archiver l'app
        if: ${{ !inputs.diagnostic_only }}
        # Archiving with automatic signing needs a development profile, which the API key cannot
        # create without a registered device. So archive unsigned, give the bundle an ad hoc
        # signature that carries the entitlements (App Group for the widget), and let the export
        # step sign it for the App Store with the distribution certificate and profiles.
        run: |
          set -euo pipefail
          xcodebuild archive \
            -project CNSNN.xcodeproj -scheme CNSNN -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$TF_ROOT/CNSNN.xcarchive" \
            -derivedDataPath "$TF_ROOT/DerivedData" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            2>&1 | tee "$TF_ROOT/logs/archive.log"
          app="$TF_ROOT/CNSNN.xcarchive/Products/Applications/CNSNN.app"
          test -d "$app/PlugIns/CNSNNWidget.appex" || { echo '::error::Widget absent de l archive.'; exit 1; }
          if [ -d "$app/Frameworks" ]; then
            find "$app/Frameworks" -maxdepth 1 \( -name '*.framework' -o -name '*.dylib' \) -exec codesign --force --sign - --timestamp=none {} \;
          fi
          codesign --force --sign - --timestamp=none --entitlements Widget/CNSNNWidget.entitlements "$app/PlugIns/CNSNNWidget.appex"
          codesign --force --sign - --timestamp=none --entitlements App/CNSNN.entitlements "$app"
          codesign -d --entitlements - "$app" 2>/dev/null | grep -q 'group.com.poupoutch.cnsnn'
          codesign -d --entitlements - "$app" 2>/dev/null | grep -q 'applinks:cnsnn-9ctosy.web.app'

      - name: Preparer le certificat et les profils
        if: ${{ !inputs.diagnostic_only }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          sign="$TF_ROOT/key/signing"
          mkdir -p "$sign"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$TF_ROOT/key/sa.json"
          GOOGLE_APPLICATION_CREDENTIALS="$TF_ROOT/key/sa.json" node Scripts/ios-signing/signing.mjs decrypt "$sign/dist-key.pem"
          rm -f "$TF_ROOT/key/sa.json"
          python3 Scripts/asc_signing.py "$ASC_KEY_ID" "$ASC_ISSUER_ID" "$TF_ROOT/key/AuthKey_$ASC_KEY_ID.p8" "$sign/dist-key.pem" "$sign" \
            com.poupoutch.cnsnn com.poupoutch.cnsnn.widget | tee "$TF_ROOT/logs/signing.log"
          # The binaries carry the widget App Group: each profile must allow it.
          for id in com.poupoutch.cnsnn com.poupoutch.cnsnn.widget; do
            if ! grep "^PROFILE $id " "$TF_ROOT/logs/signing.log" | grep -q "group.com.poupoutch.cnsnn"; then
              echo "::error::Le profil de $id n'autorise pas group.com.poupoutch.cnsnn : créer l'App Group sur developer.apple.com et le cocher sur les deux identifiants."
              exit 1
            fi
          done
          # The app also carries Associated Domains (challenge links open the app).
          if ! grep "^PROFILE com.poupoutch.cnsnn " "$TF_ROOT/logs/signing.log" | grep -q "domains=yes"; then
            echo "::error::Le profil de com.poupoutch.cnsnn n'autorise pas Associated Domains : cocher Associated Domains sur l'identifiant com.poupoutch.cnsnn (developer.apple.com)."
            exit 1
          fi
          # Temporary keychain holding only the distribution certificate.
          kc="$TF_ROOT/key/ci.keychain-db"; pass="$(uuidgen)"
          security create-keychain -p "$pass" "$kc"
          security set-keychain-settings -lut 3600 "$kc"
          security unlock-keychain -p "$pass" "$kc"
          /usr/bin/openssl x509 -inform der -in "$sign/dist-cert.der" -out "$sign/dist-cert.pem"
          /usr/bin/openssl pkcs12 -export -inkey "$sign/dist-key.pem" -in "$sign/dist-cert.pem" -out "$sign/dist.p12" -passout pass:"$pass"
          security import "$sign/dist.p12" -k "$kc" -P "$pass" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$pass" "$kc" >/dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$kc"
          for dir in "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$dir"
            grep '^PROFILE ' "$TF_ROOT/logs/signing.log" | while read -r _ id uuid _; do
              cp "$sign/$id.mobileprovision" "$dir/$uuid.mobileprovision"
            done
          done
          printf 'TF_KEYCHAIN=%s\n' "$kc" >> "$GITHUB_ENV"

      - name: Envoyer sur App Store Connect
        if: ${{ !inputs.diagnostic_only }}
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          cat > "$TF_ROOT/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key><dict>
              <key>com.poupoutch.cnsnn</key><string>$(awk '$2=="com.poupoutch.cnsnn"{print $3}' "$TF_ROOT/logs/signing.log")</string>
              <key>com.poupoutch.cnsnn.widget</key><string>$(awk '$2=="com.poupoutch.cnsnn.widget"{print $3}' "$TF_ROOT/logs/signing.log")</string>
            </dict>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$TF_ROOT/CNSNN.xcarchive" \
            -exportOptionsPlist "$TF_ROOT/ExportOptions.plist" \
            -exportPath "$TF_ROOT/export" \
            -authenticationKeyPath "$TF_ROOT/key/AuthKey_$ASC_KEY_ID.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            2>&1 | tee "$TF_ROOT/logs/export.log"
          echo "Build ${{ github.run_number }} envoyé sur App Store Connect. Il apparaît dans TestFlight après le traitement d'Apple." >> "$GITHUB_STEP_SUMMARY"

      - name: Effacer la cle API et le certificat
        if: ${{ always() }}
        run: |
          if [ -n "${TF_KEYCHAIN:-}" ]; then security delete-keychain "$TF_KEYCHAIN" || true; fi
          rm -rf "$RUNNER_TEMP/cnsnn-tf/key"

      - name: Conserver les diagnostics
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: CNSNN-TestFlight-diagnostics-${{ github.run_id }}
          path: ${{ runner.temp }}/cnsnn-tf/logs/
          if-no-files-found: warn
          retention-days: 3
