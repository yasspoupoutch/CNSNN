name: CNSNN - Android

# Builds the Android app, runs the unit tests, then the instrumented tests on an Android
# emulator against the Firebase emulators (real security rules), and publishes the APK.
on:
  push:
    branches: [main, 'claude/**']
    paths: ['Android/**', 'Firebase/firestore.rules', '.github/workflows/android.yml']
  pull_request:
    paths: ['Android/**', 'Firebase/firestore.rules', '.github/workflows/android.yml']
  workflow_dispatch:
    inputs:
      emulator_tests:
        description: Lancer les tests sur émulateur Android (Firebase local)
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: cnsnn-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compiler et tester (unitaires)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: Android
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Ouvrir la clé de signature
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        working-directory: .
        run: |
          set -euo pipefail
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo '::warning::Secret FIREBASE_SERVICE_ACCOUNT absent : APK signé avec une clé de test (ne s’installera pas par-dessus la version officielle).'
            exit 0
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json" node Android/signing/signing.mjs decrypt
          rm -f "$RUNNER_TEMP/sa.json"
      - name: Tests unitaires (règles du jeu partagées)
        run: ./gradlew --no-daemon :core:test
      - name: Compiler l'APK et l'AAB (Google Play)
        run: |
          ./gradlew --no-daemon :app:assembleRelease :app:bundleRelease :app:lintRelease
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/CNSNN.apk"
          cp app/build/outputs/bundle/release/app-release.aab "$RUNNER_TEMP/CNSNN.aab"
          rm -f "$RUNNER_TEMP/release.p12"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: CNSNN-Android-APK
          path: ${{ runner.temp }}/CNSNN.apk
          retention-days: 7
      # The file Google Play Console asks for, signed with the upload key (Play App Signing).
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: CNSNN-Android-AAB
          path: ${{ runner.temp }}/CNSNN.aab
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: android-reports
          path: |
            Android/core/build/reports
            Android/app/build/reports
          retention-days: 1

  emulator-tests:
    name: Tester sur émulateur Android (Firebase local, vraies règles)
    if: github.event_name != 'workflow_dispatch' || inputs.emulator_tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      # The emulator system image no longer fits on the runner's disk next to the preinstalled tools.
      - name: Libérer de la place sur le disque
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost \
            /usr/share/swift /usr/local/julia* /opt/hostedtoolcache/CodeQL /usr/local/share/powershell /usr/local/share/chromium
          sudo docker image prune --all --force > /dev/null 2>&1 || true
          df -h /
      - name: Activer KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Démarrer les émulateurs Firebase
        working-directory: Firebase
        run: |
          npm ci --no-audit --no-fund || npm install --no-audit --no-fund
          nohup npx firebase emulators:start --only auth,firestore --project demo-cnsnn > "$RUNNER_TEMP/emulators.log" 2>&1 &
          for i in $(seq 1 90); do
            if curl -s -o /dev/null http://127.0.0.1:8080 && curl -s -o /dev/null http://127.0.0.1:9099; then echo "Émulateurs prêts"; exit 0; fi
            sleep 2
          done
          cat "$RUNNER_TEMP/emulators.log"; exit 1
      - name: Compiler les tests
        working-directory: Android
        env:
          CNSNN_EMULATOR_HOST: 10.0.2.2
        run: ./gradlew --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest :app:assembleRelease
      - name: Tests instrumentés (Firebase, parcours de l'app)
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        env:
          CNSNN_EMULATOR_HOST: 10.0.2.2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          working-directory: Android
          script: |
            ./gradlew --no-daemon :app:connectedDebugAndroidTest
            ./tools/release-smoke.sh
      - name: Détail des échecs
        if: failure()
        run: |
          find Android/app/build/outputs/androidTest-results -name '*.xml' -exec grep -h -A25 '<failure' {} + | head -300 || true
          tail -50 "$RUNNER_TEMP/emulators.log" || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: android-emulator-reports
          path: |
            Android/app/build/reports/androidTests
            Android/app/build/outputs/androidTest-results
            ${{ runner.temp }}/emulators.log
          retention-days: 2
